<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nando's Music</title>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <style>
    body { margin: 0; background: #0b0f19; color: #fff; font-family: sans-serif; }
    /* Tela de Login com a sua foto */
    #authModal { 
      display: flex; position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 9999;
      background: #0b0f19 url('https://i.ibb.co/37jJ59f/Nandos-Fachada.jpg') no-repeat center center;
      background-size: cover; align-items: center; justify-content: center;
    }
    #authModal::before { content: ''; position: absolute; width: 100%; height: 100%; background: rgba(0,0,0,0.85); }
    .box { position: relative; z-index: 1; background: rgba(0,0,0,0.8); padding: 30px; border-radius: 20px; text-align: center; border: 1px solid #a855f7; width: 80%; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; text-align: center; }
    button { width: 100%; padding: 10px; background: #a855f7; color: white; border: none; border-radius: 5px; cursor: pointer; }
    /* Layout do Player */
    .app-content { padding: 20px; }
    video { width: 100%; height: 200px; background: #222; border-radius: 10px; }
  </style>
</head>
<body>

  <div id="authModal">
    <div class="box">
      <h2>Nando's Ar-Condicionado</h2>
      <input type="text" id="cod" placeholder="DIGITE O CÓDIGO">
      <button onclick="entrar()">ENTRAR</button>
    </div>
  </div>

  <div class="app-content">
    <h3>Nando's Music</h3>
    <video id="player" controls></video>
    <p>Selecione uma música no Painel Admin</p>
  </div>

  <script>
    const db = firebase.initializeApp({databaseURL: "https://music-nando-default-rtdb.firebaseio.com/"}).database();
    let devId = localStorage.getItem('id') || Math.random().toString(36).substr(2, 9);
    localStorage.setItem('id', devId);

    // Verifica se já está logado
    db.ref('dispositivos').once('value', s => {
      s.forEach(c => { if(c.val() === devId) document.getElementById('authModal').style.display = 'none'; });
    });

    function entrar() {
      let c = document.getElementById('cod').value.trim().toUpperCase();
      db.ref('codigos_gerados/' + c).once('value', s => {
        if(s.exists() && !s.val().usado) {
          db.ref('dispositivos/' + c).set(devId);
          db.ref('codigos_gerados/' + c).update({usado: true});
          location.reload();
        } else { alert("Código inválido ou já usado!"); }
      });
    }
  </script>
</body>
</html>
