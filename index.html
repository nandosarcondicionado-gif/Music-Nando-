<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nando's Music</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" href="#0f172a">
    <!-- FontAwesome & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase SDK Compat libraries -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
        body { background: #0b0f19; color: #fff; display: flex; flex-direction: column; min-height: 100vh; overflow-x: hidden; }
        
        /* Header */
        header { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 1.3rem; font-weight: 700; background: linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; display: flex; align-items: center; gap: 8px; }
        .admin-btn { background: rgba(168, 85, 247, 0.2); border: 1px solid #a855f7; color: #fff; padding: 8px 14px; border-radius: 20px; font-size: 0.85rem; cursor: pointer; transition: all 0.3s; }
        .admin-btn:hover { background: #a855f7; }

        /* Status Badge */
        .status-bar { background: #131b2e; padding: 8px 20px; font-size: 0.8rem; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .status-indicator { display: flex; align-items: center; gap: 6px; }
        .dot { width: 8px; height: 8px; border-radius: 50%; background: #22c55e; box-shadow: 0 0 8px #22c55e; }

        /* Main Container */
        .container { flex: 1; padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }

        /* Video Background / Visualizer Card */
        .player-card { background: #131b2e; border-radius: 16px; overflow: hidden; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; position: relative; }
        .video-container { width: 100%; height: 220px; background: #000; position: relative; display: flex; align-items: center; justify-content: center; }
        video { width: 100%; height: 100%; object-fit: cover; }
        .music-info { padding: 15px 20px; text-align: center; }
        .music-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 4px; }
        .music-category { font-size: 0.85rem; color: #94a3b8; }

        /* Player Controls */
        .controls { display: flex; align-items: center; justify-content: center; gap: 20px; padding: 15px; background: rgba(0,0,0,0.2); }
        .ctrl-btn { background: none; border: none; color: #fff; font-size: 1.4rem; cursor: pointer; transition: transform 0.2s; }
        .ctrl-btn:hover { transform: scale(1.1); color: #a855f7; }
        .ctrl-btn.play { font-size: 2.2rem; color: #a855f7; }

        /* Progress Bar */
        .progress-container { width: 100%; padding: 0 20px 15px; }
        .time-info { display: flex; justify-content: space-between; font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
        input[type="range"] { width: 100%; accent-color: #a855f7; cursor: pointer; }

        /* Category Filter */
        .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
        .cat-chip { background: #1e293b; color: #cbd5e1; padding: 8px 16px; border-radius: 20px; font-size: 0.85rem; white-space: nowrap; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; }
        .cat-chip.active { background: #a855f7; color: #fff; font-weight: 600; }

        /* Playlist */
        .playlist-title { font-size: 1rem; font-weight: 600; margin-bottom: 12px; color: #cbd5e1; }
        .playlist { display: flex; flex-direction: column; gap: 10px; }
        .song-item { background: #131b2e; padding: 12px 16px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: all 0.2s; }
        .song-item:hover { background: #1e293b; border-color: rgba(168, 85, 247, 0.3); }
        .song-item.active { border-color: #a855f7; background: rgba(168, 85, 247, 0.1); }
        .song-detail { display: flex; align-items: center; gap: 12px; }
        .song-icon { width: 36px; height: 36px; border-radius: 8px; background: rgba(168,85,247,0.2); color: #a855f7; display: flex; align-items: center; justify-content: center; }

        /* Modal Admin */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: #131b2e; width: 100%; max-width: 500px; border-radius: 20px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 1.2rem; cursor: pointer; }

        /* Form elements */
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; font-size: 0.85rem; color: #cbd5e1; margin-bottom: 6px; }
        .form-group input, .form-group select { width: 100%; padding: 10px 14px; background: #0b0f19; border: 1px solid #1e293b; border-radius: 10px; color: #fff; font-size: 0.9rem; }
        .btn-submit { width: 100%; padding: 12px; background: linear-gradient(135deg, #a855f7, #ec4899); border: none; border-radius: 10px; color: #fff; font-weight: 600; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <i class="fa-solid fa-headphones"></i> Nando's Music
        </div>
        <button class="admin-btn" onclick="openAdmin()"><i class="fa-solid fa-lock"></i> Painel Admin</button>
    </header>

    <div class="status-bar">
        <span>Sincronização em Nuvem</span>
        <div class="status-indicator">
            <div class="dot"></div>
            <span style="color:#22c55e; font-weight:600;">Firebase On</span>
        </div>
    </div>

    <div class="container">
        <!-- Player -->
        <div class="player-card">
            <div class="video-container">
                <video id="bgVideo" loop muted playsinline autoplay src="https://assets.mixkit.co/videos/preview/mixkit-abstract-fast-line-lights-animation-31622-large.mp4"></video>
            </div>
            <div class="music-info">
                <div class="music-title" id="currentTitle">Selecione uma música</div>
                <div class="music-category" id="currentCategory">Nando's Music Cloud</div>
            </div>
            
            <div class="progress-container">
                <input type="range" id="progressBar" value="0" min="0" max="100">
                <div class="time-info">
                    <span id="currentTime">00:00</span>
                    <span id="duration">00:00</span>
                </div>
            </div>

            <div class="controls">
                <button class="ctrl-btn" onclick="prevSong()"><i class="fa-solid fa-backward-step"></i></button>
                <button class="ctrl-btn play" onclick="togglePlay()"><i class="fa-solid fa-circle-play" id="playIcon"></i></button>
                <button class="ctrl-btn" onclick="nextSong()"><i class="fa-solid fa-forward-step"></i></button>
            </div>
        </div>

        <!-- Categorias -->
        <div class="categories" id="categoryChips">
            <div class="cat-chip active" onclick="filterCategory('todas', this)">Todas</div>
        </div>

        <!-- Playlist -->
        <div class="playlist-title">Sua Playlist Sincronizada</div>
        <div class="playlist" id="playlist">
            <!-- As músicas do Firebase serão carregadas aqui -->
        </div>
    </div>

    <!-- Modal Admin Login -->
    <div class="modal" id="loginModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Acesso Restrito</h3>
                <button class="close-btn" onclick="closeModal('loginModal')">&times;</button>
            </div>
            <div class="form-group">
                <label>Digite a Senha de Administrador:</label>
                <input type="password" id="adminPass" placeholder="••••••">
            </div>
            <button class="btn-submit" onclick="loginAdmin()">Entrar no Painel</button>
        </div>
    </div>

    <!-- Modal Admin Painel -->
    <div class="modal" id="adminModal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fa-solid fa-sliders"></i> Cadastrar Músicas & Vídeos</h3>
                <button class="close-btn" onclick="closeModal('adminModal')">&times;</button>
            </div>
            
            <h4 style="margin-bottom:10px; color:#a855f7;">🎵 Adicionar Música (MP3)</h4>
            <div class="form-group">
                <label>Título da Música:</label>
                <input type="text" id="songTitle" placeholder="Ex: Minha Música Favorita">
            </div>
            <div class="form-group">
                <label>Categoria:</label>
                <input type="text" id="songCategory" placeholder="Ex: Pop, Rock, Eletrônica">
            </div>
            <div class="form-group">
                <label>Link Direto do MP3 (Archive.org, Catbox, etc):</label>
                <input type="url" id="songUrl" placeholder="https://.../musica.mp3">
            </div>
            <button class="btn-submit" onclick="addSong()">Salvar na Nuvem</button>

            <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin:20px 0;">

            <h4 style="margin-bottom:10px; color:#ec4899;">🎬 Alterar Vídeo de Fundo (MP4)</h4>
            <div class="form-group">
                <label>Link do Vídeo MP4:</label>
                <input type="url" id="videoUrl" placeholder="https://.../video.mp4">
            </div>
            <button class="btn-submit" onclick="changeVideo()" style="background: linear-gradient(135deg, #ec4899, #f43f5e);">Trocar Vídeo</button>
        </div>
    </div>

    <audio id="audioPlayer"></audio>

    <script>
        // FIREBASE INTEGRADO OFICIALMENTE
        const firebaseConfig = {
            apiKey: "AIzaSyDnId6VY94Fw9lhW_i5iZEP0nnxVEjNoqo",
            authDomain: "nandomusic-c77a3.firebaseapp.com",
            databaseURL: "https://nandomusic-c77a3-default-rtdb.firebaseio.com",
            projectId: "nandomusic-c77a3",
            storageBucket: "nandomusic-c77a3.firebasestorage.app",
            messagingSenderId: "509221491611",
            appId: "1:509221491611:web:e4ea46eb04c575e377473e"
        };

        // Inicializa Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let songsList = [];
        let filteredSongs = [];
        let currentIndex = -1;
        const audio = document.getElementById('audioPlayer');
        const playIcon = document.getElementById('playIcon');

        // Escutar Músicas do Firebase em Tempo Real
        db.ref('musicas').on('value', (snapshot) => {
            const data = snapshot.val();
            songsList = [];
            if (data) {
                Object.keys(data).forEach(key => {
                    songsList.push({ id: key, ...data[key] });
                });
            }
            renderPlaylist(songsList);
            renderCategories();
        });

        // Escutar Vídeo de Fundo
        db.ref('videoBg').on('value', (snapshot) => {
            const url = snapshot.val();
            if (url) {
                document.getElementById('bgVideo').src = url;
            }
        });

        function renderPlaylist(list) {
            filteredSongs = list;
            const container = document.getElementById('playlist');
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align:center; color:#64748b; padding:20px;">Nenhuma música cadastrada ainda.<br>Use o Painel Admin para adicionar!</div>`;
                return;
            }

            list.forEach((song, index) => {
                const item = document.createElement('div');
                item.className = `song-item ${index === currentIndex ? 'active' : ''}`;
                item.onclick = () => playSong(index);
                item.innerHTML = `
                    <div class="song-detail">
                        <div class="song-icon"><i class="fa-solid fa-music"></i></div>
                        <div>
                            <div style="font-weight:600; font-size:0.95rem;">${song.titulo}</div>
                            <div style="font-size:0.8rem; color:#94a3b8;">${song.categoria || 'Geral'}</div>
                        </div>
                    </div>
                    <i class="fa-solid fa-circle-play" style="color:#a855f7;"></i>
                `;
                container.appendChild(item);
            });
        }

        function renderCategories() {
            const cats = ['todas', ...new Set(songsList.map(s => s.categoria).filter(Boolean))];
            const chips = document.getElementById('categoryChips');
            chips.innerHTML = '';
            cats.forEach(cat => {
                const chip = document.createElement('div');
                chip.className = `cat-chip ${cat === 'todas' ? 'active' : ''}`;
                chip.innerText = cat.charAt(0).toUpperCase() + cat.slice(1);
                chip.onclick = () => filterCategory(cat, chip);
                chips.appendChild(chip);
            });
        }

        function filterCategory(cat, el) {
            document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
            el.classList.add('active');
            if (cat === 'todas') {
                renderPlaylist(songsList);
            } else {
                renderPlaylist(songsList.filter(s => s.categoria === cat));
            }
        }

        function playSong(index) {
            if (index < 0 || index >= filteredSongs.length) return;
            currentIndex = index;
            const song = filteredSongs[index];
            audio.src = song.url;
            document.getElementById('currentTitle').innerText = song.titulo;
            document.getElementById('currentCategory').innerText = song.categoria || 'Geral';
            audio.play();
            playIcon.className = "fa-solid fa-circle-pause";
            renderPlaylist(filteredSongs);
        }

        function togglePlay() {
            if (!audio.src && filteredSongs.length > 0) {
                playSong(0);
                return;
            }
            if (audio.paused) {
                audio.play();
                playIcon.className = "fa-solid fa-circle-pause";
            } else {
                audio.pause();
                playIcon.className = "fa-solid fa-circle-play";
            }
        }

        function prevSong() {
            if (currentIndex > 0) playSong(currentIndex - 1);
        }

        function nextSong() {
            if (currentIndex < filteredSongs.length - 1) playSong(currentIndex + 1);
        }

        // Progresso do Áudio
        audio.ontimeupdate = () => {
            if (audio.duration) {
                const pct = (audio.currentTime / audio.duration) * 100;
                document.getElementById('progressBar').value = pct;
                document.getElementById('currentTime').innerText = formatTime(audio.currentTime);
                document.getElementById('duration').innerText = formatTime(audio.duration);
            }
        };

        document.getElementById('progressBar').oninput = (e) => {
            if (audio.duration) {
                audio.currentTime = (e.target.value / 100) * audio.duration;
            }
        };

        function formatTime(sec) {
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m < 10 ? '0' : ''}${m}:${s < 10 ? '0' : ''}${s}`;
        }

        // Funções do Modal Admin
        function openAdmin() {
            document.getElementById('loginModal').classList.add('active');
        }

        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function loginAdmin() {
            const pass = document.getElementById('adminPass').value;
            if (pass === '090417') {
                closeModal('loginModal');
                document.getElementById('adminModal').classList.add('active');
                document.getElementById('adminPass').value = '';
            } else {
                alert('Senha incorreta!');
            }
        }

        function addSong() {
            const titulo = document.getElementById('songTitle').value;
            const categoria = document.getElementById('songCategory').value;
            const url = document.getElementById('songUrl').value;

            if (!titulo || !url) {
                alert('Preencha pelo menos o título e o link da música!');
                return;
            }

            db.ref('musicas').push({ titulo, categoria, url }).then(() => {
                alert('Música salva na nuvem com sucesso!');
                document.getElementById('songTitle').value = '';
                document.getElementById('songCategory').value = '';
                document.getElementById('songUrl').value = '';
                closeModal('adminModal');
            });
        }

        function changeVideo() {
            const url = document.getElementById('videoUrl').value;
            if (!url) return;
            db.ref('videoBg').set(url).then(() => {
                alert('Vídeo de fundo atualizado!');
                document.getElementById('videoUrl').value = '';
                closeModal('adminModal');
            });
        }
    </script>
</body>
</html>
