<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title>Nando's Music</title>

    <!-- SDK do Firebase Incluso -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <style>
        *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;-webkit-tap-highlight-color:transparent}
        :root{--escuro:#121212;--medio:#181818;--claro:#282828;--destaque:#9d4edd;--texto:#ffffff;--cinza:#b3b3b3;--erro:#e74c3c;--sucesso:#2ecc71}
        body{background:var(--escuro);color:var(--texto);min-height:100vh;overflow-x:hidden;user-select:none}

        /* VÍDEO DE FUNDO DINÂMICO */
        #vid-fundo{
            position:fixed;top:0;left:0;
            width:100vw;height:100vh;
            object-fit:cover;
            opacity:0.22;
            z-index:1;
            background:#121212;
            pointer-events:none;
        }

        /* TELAS DE LOGIN */
        .tela-login{
            position:fixed;top:0;left:0;
            width:100vw;height:100vh;
            background:rgba(18,18,18,0.97);
            z-index:99999;
            display:flex;align-items:center;justify-content:center;
            padding:20px;
        }
        .caixa-login{
            background:var(--medio);padding:32px 28px;
            border-radius:14px;width:100%;max-width:390px;
            text-align:center;box-shadow:0 6px 30px rgba(0,0,0,0.8)
        }
        .caixa-login h2{color:var(--destaque);margin-bottom:28px;font-size:23px}
        .campo-entrada{
            width:100%;padding:15px 12px;
            background:var(--claro);border:1px solid #555;
            border-radius:10px;color:var(--texto);
            font-size:16px;margin-bottom:16px;
            outline:none;text-align:center
        }
        .campo-entrada:focus{border-color:var(--destaque);background:#333}
        .botao{
            width:100%;padding:15px;background:var(--destaque);
            border:none;border-radius:10px;color:white;
            font-weight:bold;font-size:16px;cursor:pointer;
            margin-bottom:12px;transition:0.2s
        }
        .botao:hover{background:#b773f0}
        .botao-voltar{background:transparent;color:var(--destaque);border:1px solid var(--destaque);margin-top:8px}
        .botao-perigo{background:var(--erro)}
        .botao-sucesso{background:var(--sucesso);color:#000}
        .botao-copiar{background:#3498db;color:#fff;width:auto;padding:6px 12px;margin:0;font-size:13px}
        .botao-baixar{background:#27ae60;color:#fff;padding:8px 12px;border-radius:6px;border:none;cursor:pointer;font-size:13px;font-weight:bold;text-decoration:none;display:inline-flex;align-items:center;gap:4px;margin-top:8px}

        /* ÁREA DO APP */
        #app{display:none;flex-direction:column;min-height:100vh;position:relative;z-index:10}

        /* MENU LATERAL */
        .menu{width:260px;background:var(--medio);padding:20px 15px;overflow-y:auto;position:fixed;left:-270px;top:0;height:100vh;transition:left 0.2s;z-index:998}
        .menu.aberto{left:0}
        .logo{font-size:20px;font-weight:bold;color:var(--destaque);margin-bottom:20px;text-align:center}
        .item-menu{display:block;padding:14px;color:var(--cinza);margin:5px 0;border-radius:8px;cursor:pointer;text-align:left;font-size:16px}
        .item-menu:hover,.item-menu.ativo{background:var(--claro);color:var(--texto)}
        .btn-menu{position:fixed;top:15px;left:15px;background:var(--destaque);border:none;color:white;padding:12px 16px;border-radius:10px;cursor:pointer;z-index:997;font-size:22px}

        /* CONTEÚDO */
        .conteudo{flex:1;padding:80px 20px 140px 20px;background:linear-gradient(180deg,rgba(26,26,46,0.85),rgba(18,18,18,0.95));min-height:100vh}
        .btn-voltar-pag{background:var(--claro);border:none;color:var(--texto);padding:12px 18px;border-radius:8px;margin-bottom:18px;cursor:pointer;font-size:16px;font-weight:bold}
        .grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
        .cartao{background:var(--medio);border-radius:12px;padding:20px 15px;text-align:center;cursor:pointer;transition:0.2s;display:flex;flex-direction:column;align-items:center;justify-content:space-between}
        .cartao:hover{background:var(--claro);transform:translateY(-2px)}
        .icone-cat{font-size:40px;margin-bottom:10px}
        .nome-cat{font-size:16px;font-weight:bold}

        /* PAINEL ADMIN */
        .secao-admin{background:var(--medio);padding:20px;border-radius:12px;margin-bottom:25px}
        .secao-admin h3{color:var(--destaque);margin-bottom:15px}
        .form-admin{display:flex;flex-direction:column;gap:12px;max-width:500px}
        .item-lista-admin{display:flex;justify-content:space-between;align-items:center;padding:12px;background:var(--claro);border-radius:8px;margin-bottom:8px;gap:8px}
        .senha-destaque{font-family:monospace;font-size:18px;letter-spacing:2px;color:var(--destaque);background:#000;padding:6px 12px;border-radius:6px}
        .status-nuvem{font-size:12px;padding:6px 12px;border-radius:6px;font-weight:bold;display:inline-block;margin-bottom:15px}

        /* PLAYER */
        .player{
            position:fixed;bottom:0;left:0;right:0;
            background:var(--medio);border-top:1px solid #333;
            padding:15px 20px;min-height:110px;
            display:flex;align-items:center;gap:15px;
            transition:transform 0.3s;transform:translateY(0);
            z-index:999;
        }
        .player.escondido{transform:translateY(100%)}
        .info-musica{display:flex;align-items:center;gap:12px;flex:1}
        .capa-player{width:55px;height:55px;background:var(--destaque);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:26px}
        .nome-atual{font-weight:bold;font-size:15px;margin-bottom:3px}
        .cat-atual{font-size:12px;color:var(--cinza)}
        .controles-player{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1.5}
        .grupo-botoes{display:flex;gap:20px;align-items:center}
        .btn-controle{background:transparent;border:none;color:var(--cinza);font-size:24px;cursor:pointer;padding:8px}
        .btn-controle:hover{color:var(--texto)}
        .btn-play-principal{background:var(--texto);color:var(--escuro);width:45px;height:45px;border-radius:50%;font-size:18px;display:flex;align-items:center;justify-content:center}
        .barra-progresso{width:100%;max-width:500px;height:8px;background:var(--claro);border-radius:4px;overflow:hidden;cursor:pointer}
        .preenchimento-prog{height:100%;background:var(--destaque);width:0%}
        .area-volume{display:flex;align-items:center;gap:8px;flex:1;justify-content:flex-end}
        .barra-volume{width:90px;height:8px;background:var(--claro);border-radius:4px;overflow:hidden;cursor:pointer}
        .preenchimento-vol{height:100%;background:var(--texto);width:70%}
        .btn-toggle-player{background:transparent;border:none;color:var(--cinza);font-size:20px;cursor:pointer;margin-left:10px;padding:5px}
    </style>
</head>
<body>

<video id="vid-fundo" autoplay loop muted playsinline preload="auto">
    <source id="source-vid-fundo" src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>

<audio id="reprodutor-audio" preload="metadata" style="display:none"></audio>

<!-- TELAS DE LOGIN -->
<div id="tela-inicial" class="tela-login">
    <div class="caixa-login">
        <h2>🎧 Nando's Music</h2>
        <button class="botao" onclick="mostrarTelaAdm()">🔐 Acessar como Administrador</button>
        <button class="botao botao-voltar" onclick="mostrarTelaUsuario()">👤 Acessar como Usuário</button>
    </div>
</div>

<div id="tela-adm" class="tela-login" style="display:none">
    <div class="caixa-login">
        <h2>Acesso do Administrador</h2>
        <input type="password" id="campo-senha-adm" class="campo-entrada" placeholder="Digite a senha de admin">
        <button class="botao" onclick="verificarAdm()">Entrar no Sistema</button>
        <button class="botao botao-voltar" onclick="voltarParaInicial()">⬅ Voltar</button>
    </div>
</div>

<div id="tela-usuario" class="tela-login" style="display:none">
    <div class="caixa-login">
        <h2>Acesso de Usuário</h2>
        <input type="text" id="campo-senha-usuario" class="campo-entrada" placeholder="Digite sua senha de acesso">
        <button class="botao" onclick="verificarUsuario()">Entrar no Sistema</button>
        <button class="botao botao-voltar" onclick="voltarParaInicial()">⬅ Voltar</button>
    </div>
</div>

<!-- ÁREA DO APP -->
<div id="app">
    <button class="btn-menu" id="botao-menu-lateral" onclick="abrirFecharMenu()">☰</button>
    
    <aside class="menu" id="menu-lateral">
        <div class="logo">🎧 Nando's Music</div>
        <div class="item-menu ativo" onclick="irParaInicio(); fecharMenu()">🏠 Página Inicial</div>
        <div class="item-menu" id="item-painel-admin" style="display:none" onclick="abrirPainelAdmin(); fecharMenu()">⚙️ Painel Admin</div>
        <div class="item-menu" onclick="sairDoSistema()">🚪 Sair da Conta</div>
        <div style="margin-top:25px;font-size:13px;color:var(--cinza);padding:0 12px">Categorias</div>
        <div id="lista-categorias"></div>
    </aside>

    <main class="conteudo">
        <div id="area-conteudo"></div>
    </main>

    <footer class="player" id="barra-player">
        <div class="info-musica">
            <div class="capa-player" id="capa-musica-atual">🎵</div>
            <div>
                <div class="nome-atual" id="nome-musica-atual">Nenhuma música selecionada</div>
                <div class="cat-atual" id="categoria-musica-atual">Escolha uma categoria para começar</div>
                <a id="btn-download-player" href="#" target="_blank" download class="botao-baixar" style="display:none;padding:3px 8px;font-size:11px">📥 Baixar MP3</a>
            </div>
        </div>
        <div class="controles-player">
            <div class="grupo-botoes">
                <button class="btn-controle" onclick="musicaAnterior()">⏮</button>
                <button class="btn-controle btn-play-principal" id="botao-play-principal" onclick="alternarPlayPause()">▶</button>
                <button class="btn-controle" onclick="proximaMusica()">⏭</button>
            </div>
            <div class="barra-progresso" id="barra-progresso" onclick="irParaTempoEspecifico(event)">
                <div class="preenchimento-prog" id="preenchimento-progresso"></div>
            </div>
        </div>
        <div class="area-volume">
            <span>🔊</span>
            <div class="barra-volume" id="barra-volume" onclick="ajustarVolume(event)">
                <div class="preenchimento-vol" id="preenchimento-volume"></div>
            </div>
            <button class="btn-toggle-player" onclick="alternarVisibilidadePlayer()">▼</button>
        </div>
    </footer>
</div>

<script>
let usarNouvem = false;
let db = null;

let senhaAdmAtual = localStorage.getItem('nando_senha_adm') || "090417";

const CATEGORIAS_PADRAO = [
    {nome:"🎸 Sertanejo", icone:"🎸"},
    {nome:"🪗 Forró", icone:"🪗"},
    {nome:"🥁 Funk", icone:"🥁"},
    {nome:"✝️ Gospel", icone:"✝️"},
    {nome:"🎹 MPB / Samba", icone:"🎹"},
    {nome:"🎸 Rock / Pop", icone:"🎸"}
];

const ARQUIVOS_PADRAO = {
    "🎸 Sertanejo": [
        {nome:"Sertanejo Exemplo 1", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3"},
        {nome:"Sertanejo Exemplo 2", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3"}
    ],
    "🪗 Forró": [
        {nome:"Forró Exemplo 1", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3"}
    ],
    "🥁 Funk": [
        {nome:"Funk Exemplo 1", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3"}
    ],
    "✝️ Gospel": [
        {nome:"Gospel Exemplo 1", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3"}
    ],
    "🎹 MPB / Samba": [
        {nome:"MPB Exemplo 1", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3"}
    ],
    "🎸 Rock / Pop": [
        {nome:"Rock Exemplo 1", url:"https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3"}
    ]
};

const VIDEOS_PADRAO = [
    {nome:"Animação Exemplo 1", url:"https://www.w3schools.com/html/mov_bbb.mp4"},
    {nome:"Flor Exemplo 2", url:"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4"}
];

let bancoCategorias = JSON.parse(localStorage.getItem('nando_categorias')) || CATEGORIAS_PADRAO;
let bancoArquivos = JSON.parse(localStorage.getItem('nando_arquivos')) || ARQUIVOS_PADRAO;
let bancoSenhasUsuarios = JSON.parse(localStorage.getItem('nando_senhas_usuarios')) || ["User1234"];
let bancoVideos = JSON.parse(localStorage.getItem('nando_videos')) || VIDEOS_PADRAO;

let firebaseConfigSalvo = JSON.parse(localStorage.getItem('nando_firebase_config'));

function conectarFirebase(cfg){
    if(!cfg || !cfg.apiKey || !cfg.databaseURL) return false;
    try {
        if (!firebase.apps.length) {
            firebase.initializeApp(cfg);
        }
        db = firebase.database();
        usarNouvem = true;

        db.ref('nando_music_db').on('value', (snapshot) => {
            const dados = snapshot.val();
            if (dados) {
                if(dados.senhaAdm) senhaAdmAtual = dados.senhaAdm;
                if(dados.categorias) bancoCategorias = dados.categorias;
                if(dados.arquivos) bancoArquivos = dados.arquivos;
                if(dados.senhasUsuarios) bancoSenhasUsuarios = dados.senhasUsuarios;
                if(dados.videos) bancoVideos = dados.videos;

                carregarCategoriasNoMenu();
                if(document.getElementById('app').style.display === 'flex' && categoriaAberta){
                    abrirCategoria(categoriaAberta);
                }
            }
        });
        return true;
    } catch(e) {
        console.error("Erro no Firebase:", e);
        usarNouvem = false;
        return false;
    }
}

if(firebaseConfigSalvo){
    conectarFirebase(firebaseConfigSalvo);
}

function salvarDadosGerais(){
    localStorage.setItem('nando_senha_adm', senhaAdmAtual);
    localStorage.setItem('nando_categorias', JSON.stringify(bancoCategorias));
    localStorage.setItem('nando_arquivos', JSON.stringify(bancoArquivos));
    localStorage.setItem('nando_senhas_usuarios', JSON.stringify(bancoSenhasUsuarios));
    localStorage.setItem('nando_videos', JSON.stringify(bancoVideos));

    if(usarNouvem && db){
        db.ref('nando_music_db').set({
            senhaAdm: senhaAdmAtual,
            categorias: bancoCategorias,
            arquivos: bancoArquivos,
            senhasUsuarios: bancoSenhasUsuarios,
            videos: bancoVideos
        });
    }
}

let tipoUsuarioLogado = null, categoriaAberta = null, listaArquivosAtuais = [], indiceArquivoAtual = -1, playerVisivel = true;
const reprodutorAudio = document.getElementById('reprodutor-audio');

function trocarVideoFundoAleatorio(){
    if(!bancoVideos || bancoVideos.length === 0) return;
    const indiceSorteado = Math.floor(Math.random() * bancoVideos.length);
    const videoSorteado = bancoVideos[indiceSorteado];
    
    const playerVid = document.getElementById('vid-fundo');
    const sourceVid = document.getElementById('source-vid-fundo');
    
    if(sourceVid.src !== videoSorteado.url){
        sourceVid.src = videoSorteado.url;
        playerVid.load();
        playerVid.play().catch(()=>{});
    }
}

function gerarSenhaAleatoria(tamanho = 8) {
    const caracteres = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
    let res = '';
    for (let i = 0; i < tamanho; i++) res += caracteres.charAt(Math.floor(Math.random() * caracteres.length));
    return res;
}

function copiarSenha(senhaText) {
    if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(senhaText).then(() => { alert(`Senha "${senhaText}" copiada!`); });
    } else {
        const inputTemp = document.createElement("input");
        inputTemp.value = senhaText;
        document.body.appendChild(inputTemp);
        inputTemp.select();
        document.execCommand("copy");
        document.body.removeChild(inputTemp);
        alert(`Senha "${senhaText}" copiada!`);
    }
}

function mostrarTelaAdm(){document.getElementById('tela-inicial').style.display='none';document.getElementById('tela-adm').style.display='flex'}
function mostrarTelaUsuario(){document.getElementById('tela-inicial').style.display='none';document.getElementById('tela-usuario').style.display='flex'}
function voltarParaInicial(){
    document.getElementById('tela-adm').style.display='none';
    document.getElementById('tela-usuario').style.display='none';
    document.getElementById('tela-inicial').style.display='flex';
}

function verificarAdm(){
    const senha = document.getElementById('campo-senha-adm').value.trim();
    if(senha === senhaAdmAtual){
        tipoUsuarioLogado = 'administrador';
        iniciarSistema();
        document.getElementById('item-painel-admin').style.display = 'block';
    }else{
        alert('Senha de administrador incorreta!');
    }
}

function verificarUsuario(){
    const senha = document.getElementById('campo-senha-usuario').value.trim();
    if(bancoSenhasUsuarios.includes(senha)){
        tipoUsuarioLogado = 'usuario';
        iniciarSistema();
    }else{
        alert('Senha de acesso inválida!');
    }
}

function iniciarSistema(){
    document.querySelectorAll('.tela-login').forEach(t => t.style.display = 'none');
    document.getElementById('app').style.display = 'flex';
    carregarCategoriasNoMenu();
    mostrarPaginaInicial();
    trocarVideoFundoAleatorio();
    reprodutorAudio.volume = 0.7;
    configurarControlesDoCarro();
}

function carregarCategoriasNoMenu(){
    document.getElementById('lista-categorias').innerHTML = bancoCategorias.map(cat => 
        `<div class="item-menu" onclick="abrirCategoria('${cat.nome}')">${cat.icone} ${cat.nome}</div>`
    ).join('');
}

function abrirFecharMenu(){document.getElementById('menu-lateral').classList.toggle('aberto')}
function fecharMenu(){document.getElementById('menu-lateral').classList.remove('aberto')}
function alternarVisibilidadePlayer(){
    playerVisivel = !playerVisivel;
    document.getElementById('barra-player').classList.toggle('escondido', !playerVisivel);
}

function mostrarPaginaInicial(){
    categoriaAberta = null;
    document.getElementById('area-conteudo').innerHTML = `
        <h2 style="margin-bottom:20px">Escolha uma Categoria</h2>
        <div class="grade">
            ${bancoCategorias.map(cat => `
                <div class="cartao" onclick="abrirCategoria('${cat.nome}')">
                    <div class="icone-cat">${cat.icone}</div>
                    <div class="nome-cat">${cat.nome}</div>
                </div>
            `).join('')}
        </div>
    `;
}

function irParaInicio(){mostrarPaginaInicial(); fecharMenu()}

function abrirCategoria(nomeCategoria){
    categoriaAberta = nomeCategoria;
    listaArquivosAtuais = bancoArquivos[nomeCategoria] || [];
    
    let htmlConteudo = `<button class="btn-voltar-pag" onclick="mostrarPaginaInicial()">⬅ Voltar para Categorias</button>`;
    htmlConteudo += `<h2 style="margin-bottom:15px">${nomeCategoria}</h2>`;

    if(listaArquivosAtuais.length === 0){
        htmlConteudo += `<p style="color:var(--cinza)">Nenhuma música cadastrada nesta categoria ainda.</p>`;
    }else{
        htmlConteudo += `<div class="grade">
            ${listaArquivosAtuais.map((arq, indice) => `
                <div class="cartao" onclick="reproduzirArquivo(${in
