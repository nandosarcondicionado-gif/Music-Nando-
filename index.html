<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nando's Music Pro</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Firebase SDK -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <style>
    :root { --primary: #a855f7; --bg: #0b0f19; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
    body { background: var(--bg); color: #fff; min-height: 100vh; display: flex; flex-direction: column; }
    
    header { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(10px); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .logo { font-size: 1.2rem; font-weight: 700; background: linear-gradient(135deg, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .admin-btn { background: rgba(168, 85, 247, 0.2); border: 1px solid #a855f7; color: #fff; padding: 6px 14px; border-radius: 8px; cursor: pointer; font-size: 0.9rem; }
    .admin-btn:hover { background: #a855f7; }

    .filter-bar { display: flex; gap: 10px; padding: 15px 20px; overflow-x: auto; background: #131b2e; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .filter-btn { background: #1e293b; border: none; color: #fff; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-size: 0.85rem; white-space: nowrap; }
    .filter-btn.active { background: var(--primary); }

    .player-section { padding: 20px; max-width: 800px; margin: 0 auto; width: 100%; }
    video { width: 100%; height: 260px; border-radius: 12px; background: #000; object-fit: cover; }
    .now-playing { margin-top: 10px; font-size: 1.1rem; font-weight: 600; text-align: center; color: #cbd5e1; }

    .playlist-container { padding: 0 20px 20px 20px; max-width: 800px; margin: 0 auto; width: 100%; flex: 1; }
    .song-item { background: #151b2c; padding: 12px 15px; margin-bottom: 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.05); display: flex; justify-content: space-between; align-items: center; transition: 0.2s; }
    .song-item:hover { background: rgba(168, 85, 247, 0.1); border-color: rgba(168, 85, 247, 0.3); }
    
    .song-info { flex: 1; cursor: pointer; }
    .song-actions { display: flex; gap: 12px; align-items: center; }
    .action-icon { cursor: pointer; font-size: 1rem; color: #94a3b8; transition: 0.2s; }
    .action-icon:hover { color: var(--primary); }

    /* Modais */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(5px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-content { background: #111827; border: 1px solid rgba(255,255,255,0.1); width: 100%; max-width: 500px; border-radius: 16px; padding: 25px; max-height: 90vh; overflow-y: auto; }
    
    input, select { width: 100%; padding: 10px 14px; margin: 8px 0; background: #0b0f19; border: 1px solid rgba(255,255,255,0.1); color: #fff; border-radius: 8px; font-size: 0.9rem; }
    .btn-submit { width: 100%; background: linear-gradient(135deg, #a855f7, #ec4899); border: none; padding: 12px; border-radius: 8px; color: #fff; font-weight: bold; cursor: pointer; margin-top: 10px; }
    .btn-danger { background: #ef4444; border: none; padding: 6px 10px; border-radius: 6px; color: #fff; cursor: pointer; font-size: 0.75rem; }
    
    .admin-list-row { display: flex; justify-content: space-between; align-items: center; background: #0b0f19; padding: 10px; border-radius: 8px; margin-bottom: 6px; font-size: 0.85rem; }
  </style>
</head>
<body>

  <!-- TELA DE BLOQUEIO / CÓDIGO DE ACESSO -->
  <div id="authModal" class="modal active">
    <div class="modal-content" style="text-align: center;">
      <h2 style="margin-bottom: 10px;"><i class="fa-solid fa-lock" style="color: var(--primary);"></i> Acesso Restrito</h2>
      <p style="color: #94a3b8; font-size: 0.9rem; margin-bottom: 20px;">Digite o código de acesso fornecido pelo Administrador.</p>
      <input type="text" id="userAccessCode" placeholder="EX: NANDO-1234" style="text-align: center; text-transform: uppercase; font-size: 1.2rem; letter-spacing: 2px;">
      <button class="btn-submit" onclick="validarCodigoUsuario()">Entrar no Aplicativo</button>
      <p id="authError" style="color: #ef4444; font-size: 0.8rem; margin-top: 10px; display: none;"></p>
      
      <div style="margin-top: 25px; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 15px;">
        <button onclick="fecharAuthEAbrirAdmin()" style="background: none; border: none; color: var(--primary); font-size: 0.85rem; cursor: pointer; text-decoration: underline;">Sou Administrador</button>
      </div>
    </div>
  </div>

  <!-- HEADER -->
  <header>
    <div class="logo"><i class="fa-solid fa-headphones"></i> Nando's Music</div>
    <button class="admin-btn" onclick="abrirAdmin()"><i class="fa-solid fa-gear"></i> Painel Admin</button>
  </header>

  <!-- FILTROS DE CATEGORIA -->
  <div class="filter-bar">
    <button class="filter-btn active" onclick="filtrar('Todas', this)">Todas</button>
    <button class="filter-btn" onclick="filtrar('Sertanejo', this)">Sertanejo</button>
    <button class="filter-btn" onclick="filtrar('Funk', this)">Funk</button>
    <button class="filter-btn" onclick="filtrar('Forró', this)">Forró</button>
    <button class="filter-btn" onclick="filtrar('Pagode', this)">Pagode</button>
    <button class="filter-btn" onclick="filtrar('Eletrônica', this)">Eletrônica</button>
    <button class="filter-btn" onclick="filtrar('Trap', this)">Trap</button>
    <button class="filter-btn" onclick="filtrar('Pop', this)">Pop</button>
    <button class="filter-btn" onclick="filtrar('Rock', this)">Rock</button>
    <button class="filter-btn" onclick="filtrar('Engraçado', this)">Engraçados</button>
  </div>

  <!-- PLAYER PRINCIPAL -->
  <div class="player-section">
    <video id="mainPlayer" controls autoplay></video>
    <div class="now-playing" id="nowPlaying">Carregando player...</div>
  </div>

  <!-- PLAYLIST -->
  <div class="playlist-container" id="playlistContainer"></div>

  <!-- MODAL ADMIN -->
  <div id="adminModal" class="modal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 15px;">
        <h3>Painel Administrativo</h3>
        <button onclick="fecharAdmin()" style="background:none; border:none; color:#fff; font-size:1.2rem; cursor:pointer;">&times;</button>
      </div>
      
      <!-- Login Admin -->
      <div id="adminLoginBox">
        <label style="font-size: 0.85rem; color: #94a3b8;">Senha de Administrador</label>
        <input type="password" id="admPass" placeholder="Digite a senha (1234)">
      </div>

      <!-- Conteúdo Admin -->
      <div id="adminDashboard" style="display:none;">
        
        <!-- Abas de navegação do admin -->
        <div style="display:flex; gap:5px; margin-bottom:15px; overflow-x:auto;">
          <button class="filter-btn active" onclick="mudarAbaAdmin('musicas', this)">Músicas</button>
          <button class="filter-btn" onclick="mudarAbaAdmin('fundos', this)">Vídeos de Fundo</button>
          <button class="filter-btn" onclick="mudarAbaAdmin('codigos', this)">Códigos</button>
        </div>

        <!-- Gerenciar Músicas -->
        <div id="secMusicas">
          <h4 style="color:var(--primary); font-size:0.95rem; margin-bottom:8px;">Adicionar Música</h4>
          <input type="text" id="sTitle" placeholder="Título da Música">
          <input type="text" id="sUrl" placeholder="Link Direto do Vídeo (.mp4)">
          <select id="sCat">
            <option value="Sertanejo">Sertanejo</option>
            <option value="Funk">Funk</option>
            <option value="Forró">Forró</option>
            <option value="Pagode">Pagode</option>
            <option value="Eletrônica">Eletrônica</option>
            <option value="Trap">Trap</option>
            <option value="Pop">Pop</option>
            <option value="Rock">Rock</option>
            <option value="Engraçado">Engraçado</option>
          </select>
          <button class="btn-submit" onclick="salvarMusica()">Salvar Música</button>
          <div id="adminMusicList" style="margin-top:15px; max-height: 150px; overflow-y:auto;"></div>
        </div>

        <!-- Gerenciar Vídeos de Fundo -->
        <div id="secFundos" style="display:none;">
          <h4 style="color:var(--primary); font-size:0.95rem; margin-bottom:8px;">Vídeos de Fundo (Modo Ocioso)</h4>
          <p style="font-size:0.75rem; color:#94a3b8; margin-bottom:8px;">Estes vídeos vão rodar aleatoriamente quando nenhuma música estiver tocando.</p>
          <input type="text" id="bgUrl" placeholder="Link Direto do Vídeo de Fundo (.mp4)">
          <button class="btn-submit" onclick="salvarFundo()">Adicionar Vídeo de Fundo</button>
          <div id="adminBgList" style="margin-top:15px; max-height: 150px; overflow-y:auto;"></div>
        </div>

        <!-- Gerenciar Códigos de Acesso -->
        <div id="secCodigos" style="display:none;">
          <h4 style="color:var(--primary); font-size:0.95rem; margin-bottom:8px;">Gerar Códigos de Aparelho</h4>
          <button class="btn-submit" onclick="gerarNovoCodigo()"><i class="fa-solid fa-key"></i> Gerar Novo Código</button>
          <div id="adminCodesList" style="margin-top:15px; max-height: 150px; overflow-y:auto;"></div>
        </div>

      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = { databaseURL: "https://music-nando-default-rtdb.firebaseio.com/" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let deviceId = localStorage.getItem('nando_device_id');
    if (!deviceId) {
      deviceId = 'DEV-' + Math.random().toString(36).substring(2, 9).toUpperCase();
      localStorage.setItem('nando_device_id', deviceId);
    }

    let allSongs = [];
    let bgVideos = [];

    function verificarAutorizacaoAparelho() {
      db.ref('dispositivos_autorizados').once('value', snapshot => {
        let autorizados = snapshot.val() || {};
        let autorizado = false;
        for (let codigo in autorizados) {
          if (autorizados[codigo].deviceId === deviceId) {
            autorizado = true;
            break;
          }
        }
        if (autorizado) {
          document.getElementById('authModal').classList.remove('active');
        }
      });
    }

    function fecharAuthEAbrirAdmin() {
      document.getElementById('authModal').classList.remove('active');
      abrirAdmin();
    }

    function validarCodigoUsuario() {
      let codigo = document.getElementById('userAccessCode').value.trim().toUpperCase();
      let errorEl = document.getElementById('authError');
      if (!codigo) { errorEl.innerText = "Digite um código!"; errorEl.style.display = 'block'; return; }

      db.ref('codigos_gerados/' + codigo).once('value', snapshot => {
        let dados = snapshot.val();
        if (!dados) { errorEl.innerText = "Código inválido."; errorEl.style.display = 'block'; return; }
        if (dados.usado && dados.deviceId !== deviceId) { errorEl.innerText = "Código já usado em outro aparelho."; errorEl.style.display = 'block'; return; }

        db.ref('codigos_gerados/' + codigo).update({ usado: true, deviceId: deviceId });
        db.ref('dispositivos_autorizados/' + codigo).set({ deviceId: deviceId });
        document.getElementById('authModal').classList.remove('active');
        alert("Aparelho autorizado!");
      });
    }

    function abrirAdmin() { document.getElementById('adminModal').classList.add('active'); }
    function fecharAdmin() { document.getElementById('adminModal').classList.remove('active'); }

    // Correção: Definida a função para evitar crash no carregamento do painel
    function carregarDadosAdmin() {
      // Os dados já são carregados automaticamente via listeners do Firebase em tempo real.
    }

    document.getElementById('admPass').oninput = (e) => {
      if (e.target.value === "1234") {
        document.getElementById('adminLoginBox').style.display = 'none';
        document.getElementById('adminDashboard').style.display = 'block';
        carregarDadosAdmin();
      }
    };

    function mudarAbaAdmin(aba, btn) {
      document.querySelectorAll('#adminDashboard .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      document.getElementById('secMusicas').style.display = aba === 'musicas' ? 'block' : 'none';
      document.getElementById('secFundos').style.display = aba === 'fundos' ? 'block' : 'none';
      document.getElementById('secCodigos').style.display = aba === 'codigos' ? 'block' : 'none';
    }

    function salvarMusica() {
      const title = document.getElementById('sTitle').value;
      const url = document.getElementById('sUrl').value;
      const category = document.getElementById('sCat').value;
      if (!title || !url) { alert("Preencha todos os campos!"); return; }
      db.ref('musicas').push({ title, url, category }).then(() => {
        alert("Música salva!");
        document.getElementById('sTitle').value = '';
        document.getElementById('sUrl').value = '';
      }).catch(err => alert("Erro ao salvar (verifique as Regras do Firebase): " + err.message));
    }

    function salvarFundo() {
      const url = document.getElementById('bgUrl').value;
      if (!url) { alert("Coloque o link do vídeo!"); return; }
      db.ref('background_videos').push({ url }).then(() => {
        alert("Vídeo de fundo adicionado!");
        document.getElementById('bgUrl').value = '';
      }).catch(err => alert("Erro ao salvar: " + err.message));
    }

    function gerarNovoCodigo() {
      let chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
      let novo = 'ND-';
      for(let i=0; i<4; i++) novo += chars.charAt(Math.floor(Math.random() * chars.length));
      db.ref('codigos_gerados/' + novo).set({ usado: false, deviceId: null })
        .then(() => alert("Código gerado com sucesso: " + novo))
        .catch(err => alert("Erro ao gerar código. Verifique se o banco permite gravação: " + err.message));
    }

    function deletar(caminho, id) {
      if(confirm("Deseja realmente excluir?")) {
        db.ref(caminho + '/' + id).remove();
      }
    }

    db.ref('musicas').on('value', snap => {
      allSongs = [];
      const data = snap.val();
      let html = '', adminHtml = '';
      for(let id in data) {
        allSongs.push({ id, ...data[id] });
        html += `<div class="song-item">
                    <div class="song-info" onclick="tocar('${data[id].url}', '${data[id].title}')">
                      <strong>${data[id].title}</strong> <span style="font-size:0.75rem; color:var(--primary);">(${data[id].category})</span>
                    </div>
                    <div class="song-actions">
                      <a href="${data[id].url}" download target="_blank" class="action-icon" title="Baixar Offline"><i class="fa-solid fa-download"></i></a>
                      <i class="fa-solid fa-play action-icon" onclick="tocar('${data[id].url}', '${data[id].title}')"></i>
                    </div>
                 </div>`;
        adminHtml += `<div class="admin-list-row"><span>${data[id].title}</span> <button class="btn-danger" onclick="deletar('musicas', '${id}')">Excluir</button></div>`;
      }
      document.getElementById('playlistContainer').innerHTML = html;
      if(document.getElementById('adminMusicList')) document.getElementById('adminMusicList').innerHTML = adminHtml;
    });

    db.ref('background_videos').on('value', snap => {
      bgVideos = [];
      const data = snap.val();
      let adminHtml = '';
      for(let id in data) {
        bgVideos.push(data[id].url);
        adminHtml += `<div class="admin-list-row"><span>Vídeo Fundo (${id.substring(0,5)})</span> <button class="btn-danger" onclick="deletar('background_videos', '${id}')">Excluir</button></div>`;
      }
      if(document.getElementById('adminBgList')) document.getElementById('adminBgList').innerHTML = adminHtml;
      
      const player = document.getElementById('mainPlayer');
      if (player.paused && !player.src) {
        tocarFundoAleatorio();
      }
    });

    db.ref('codigos_gerados').on('value', snap => {
      const data = snap.val();
      let html = '';
      for(let id in data) {
        let status = data[id].usado ? 'Usado' : 'Disponível';
        html += `<div class="admin-list-row"><span><strong>${id}</strong> (${status})</span> <button class="btn-danger" onclick="deletar('codigos_gerados', '${id}')">Excluir</button></div>`;
      }
      if(document.getElementById('adminCodesList')) document.getElementById('adminCodesList').innerHTML = html;
    });

    function tocar(url, title) {
      const player = document.getElementById('mainPlayer');
      player.src = url;
      player.play();
      document.getElementById('nowPlaying').innerText = title;
    }

    function tocarFundoAleatorio() {
      if (bgVideos.length > 0) {
        let randomUrl = bgVideos[Math.floor(Math.random() * bgVideos.length)];
        tocar(randomUrl, "Modo Fundo (Aleatório)");
      } else {
        document.getElementById('nowPlaying').innerText = "Nenhum vídeo de fundo cadastrado";
      }
    }

    document.getElementById('mainPlayer').onended = () => {
      tocarFundoAleatorio();
    };

    function filtrar(cat, btn) {
      document.querySelectorAll('.filter-bar .filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      
      const container = document.getElementById('playlistContainer');
      container.innerHTML = '';
      allSongs.forEach(s => {
        if(cat === 'Todas' || s.category === cat) {
          container.innerHTML += `<div class="song-item">
                                      <div class="song-info" onclick="tocar('${s.url}', '${s.title}')">
                                        <strong>${s.title}</strong> <span style="font-size:0.75rem; color:var(--primary);">(${s.category})</span>
                                      </div>
                                      <div class="song-actions">
                                        <a href="${s.url}" download target="_blank" class="action-icon" title="Baixar Offline"><i class="fa-solid fa-download"></i></a>
                                        <i class="fa-solid fa-play action-icon" onclick="tocar('${s.url}', '${s.title}')"></i>
                                      </div>
                                   </div>`;
        }
      });
    }

    window.onload = () => {
      verificarAutorizacaoAparelho();
    };
  </script>
</body>
</html>
